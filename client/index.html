<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- ?v= busts the browsers' favicon cache: bump it whenever the icons in /brand change. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B0E0D" />
    <!-- Impact (Base44 affiliate program) checks it owns the site: the meta tag, and its text segment
         for the "editing content" option. Impact-Site-Verification: fae1da62-8915-4c96-a1a8-009312023c07 -->
    <meta name="impact-site-verification" value="fae1da62-8915-4c96-a1a8-009312023c07" />
    <!-- Fonts (Unbounded headings, Figtree text): preconnect + stylesheet in the HTML so they
         start downloading immediately instead of waiting for the CSS bundle. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Unbounded:wght@300..500&display=swap" />
    <!-- SEO tags (title, description, canonical, Open Graph, JSON-LD) are injected per page at build
         time from client/src/config/seo.ts. Dev keeps this generic title. -->
    <!--seo-head-->
    <title>MakeSaaS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
